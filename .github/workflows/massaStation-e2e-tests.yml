name: MassaStation e2e tests

on:
  push:
    # for these branchs, tests will be callend from publish workflow
    branches-ignore:
      - main
      - next
  workflow_call:

jobs:
  format:
    uses: ./.github/workflows/check-format.yml

  massaStation-tests-e2e:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          sudo apt update
          npm ci && npm run build
          sudo apt install xvfb libnss3-tools libwebkit2gtk-4.1-0 locales
          sudo locale-gen en_US.UTF-8


      - name: Install MassaStation
        run: |
          gh release download --repo massalabs/station --pattern 'massastation_*_amd64.deb' --output massastation.deb
          # preinst skips the interactive terms and conditions prompt if this file exists
          sudo mkdir -p /usr/local/share/massastation
          sudo touch /usr/local/share/massastation/agreed_to_terms_and_conditions
          # postinst creates config/certs dirs owned by $SUDO_USER, sets CAP_NET_BIND_SERVICE and maps station.massa in /etc/hosts
          sudo apt install -y --no-install-recommends ./massastation.deb
          sudo massastation -repair
          # -repair runs as root (to trust the CA system-wide) and creates the CA key with 0600: hand files back to the runner
          sudo chown -R "$USER" /usr/local/share/massastation /etc/massastation
          mkdir -p $HOME/.config/massa-station-wallet/
          echo "$WALLET_YML" > $HOME/.config/massa-station-wallet/wallet_e2e.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          WALLET_YML: ${{ secrets.WALLET_YML }}

      - name: Running Massastation
        run: xvfb-run massastation > massastation_logs.txt &
        env:
          WALLET_PASSWORD: ${{ secrets.WALLET_PWD }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Wait for API to be ready on port 80
        run: |
          echo "Waiting for API to be ready on port 80..."
          timeout 60 bash -c 'until nc -z 127.0.0.1 80; do sleep 1; done'
          echo "API is ready!"

      # MassaStation installs the wallet plugin itself on first run
      - name: Wait for MassaStation Wallet to be up
        run: |
          timeout 120 bash -c 'until curl -sf http://station.massa/plugin-manager | jq -e ".[] | select(.name == \"Massa Wallet\" and .status == \"Up\")" > /dev/null; do sleep 2; done'
          curl -sS --cacert /etc/massastation/certs/rootCA.pem https://station.massa/plugin-manager | jq .

      - name: Switch to buildnet
        run: |
          curl -X POST -H "Origin: http://station.massa" "http://station.massa/network/buildnet"
          
      - name: Run test suite
        run: NODE_EXTRA_CA_CERTS=/etc/massastation/certs/rootCA.pem npm run test:e2e

      - name: Print MassaStation logs
        if: always()
        run: cat massastation_logs.txt
